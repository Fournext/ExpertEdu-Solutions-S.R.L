services:
  postgres:
    image: postgres:16-alpine
    container_name: expertedu-corp-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_corp_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - corp_internal

  backend:
    build:
      context: ./backend
    container_name: expertedu-corp-backend-prod
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      DJANGO_DEBUG: "False"
      # Nginx handles TLS termination at the reverse proxy layer
      DJANGO_SECURE_SSL_REDIRECT: "False"
    volumes:
      - backend_static_prod:/app/staticfiles
    networks:
      - corp_internal

  frontend:
    build:
      context: ./frontend
      args:
        PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:-/api/v1}
        PUBLIC_EXPERTEDU_STUDIO_URL: ${PUBLIC_EXPERTEDU_STUDIO_URL:-}
        PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-https://expertedu.fournext.website}
        PUBLIC_COMMERCIAL_EMAIL: ${CONTACT_NOTIFICATION_EMAIL:-contacto@expertedu.bo}
        PUBLIC_SUPPORT_EMAIL: ${SUPPORT_NOTIFICATION_EMAIL:-soporte@expertedu.bo}
    container_name: expertedu-corp-frontend-prod
    restart: unless-stopped
    networks:
      - corp_internal

  nginx:
    image: nginx:1.27-alpine
    container_name: expertedu-corp-nginx-prod
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/expertedu.conf:/etc/nginx/conf.d/default.conf:ro
      - backend_static_prod:/var/www/static:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    networks:
      - corp_internal

volumes:
  postgres_corp_prod_data:
  backend_static_prod:

networks:
  corp_internal:
    driver: bridge
