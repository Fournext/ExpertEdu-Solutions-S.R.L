services:
  postgres:
    image: postgres:16-alpine
    container_name: expertedu-corp-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-expertedu_corp}
      POSTGRES_USER: ${POSTGRES_USER:-expertedu_corp_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_local_only}
    volumes:
      - postgres_corp_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-expertedu_corp_user} -d ${POSTGRES_DB:-expertedu_corp}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: expertedu-corp-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-local-dev-secret-key-change-in-production}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-False}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:8080,http://127.0.0.1}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
      DJANGO_SECURE_SSL_REDIRECT: "False"
      POSTGRES_DB: ${POSTGRES_DB:-expertedu_corp}
      POSTGRES_USER: ${POSTGRES_USER:-expertedu_corp_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_local_only}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-True}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-contacto@expertedu.fournext.website}
      CONTACT_NOTIFICATION_EMAIL: ${CONTACT_NOTIFICATION_EMAIL:-contacto@expertedu.fournext.website}
      SUPPORT_NOTIFICATION_EMAIL: ${SUPPORT_NOTIFICATION_EMAIL:-contacto@expertedu.fournext.website}
    volumes:
      - backend_static:/app/staticfiles

  frontend:
    build:
      context: ./frontend
      args:
        PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:-/api/v1}
        PUBLIC_EXPERTEDU_STUDIO_URL: ${PUBLIC_EXPERTEDU_STUDIO_URL:-}
        PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-http://localhost:8080}
        PUBLIC_COMMERCIAL_EMAIL: ${CONTACT_NOTIFICATION_EMAIL:-contacto@expertedu.bo}
        PUBLIC_SUPPORT_EMAIL: ${SUPPORT_NOTIFICATION_EMAIL:-soporte@expertedu.bo}
    container_name: expertedu-corp-frontend

  nginx:
    image: nginx:1.27-alpine
    container_name: expertedu-corp-nginx
    depends_on:
      - frontend
      - backend
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./nginx/local.conf:/etc/nginx/conf.d/default.conf:ro
      - backend_static:/var/www/static:ro

volumes:
  postgres_corp_data:
  backend_static:
