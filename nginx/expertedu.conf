# Nginx Reverse Proxy for ExpertEdu Corporate Website (EC2)
# Production HTTPS configuration. Certificates must exist before starting Nginx.

upstream expertedu_frontend {
    server frontend:80;
}

upstream expertedu_backend {
    server backend:8000;
}

server {
    listen 80;
    server_name expertedu.fournext.website;

    return 301 https://expertedu.fournext.website$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name expertedu.fournext.website;

    ssl_certificate /etc/letsencrypt/live/expertedu.fournext.website/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/expertedu.fournext.website/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    absolute_redirect off;

    client_max_body_size 5M;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    location /api/ {
        proxy_pass http://expertedu_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://expertedu_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        alias /var/www/static/;
        expires 30d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://expertedu_frontend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# -----------------------------------------------------------------------------
# ExpertEdu Studio (Producto) — expertedu-studio.fournext.website
# Apunta al puerto expuesto en el host EC2 (por defecto 8081) vía host.docker.internal
# -----------------------------------------------------------------------------
upstream expertedu_studio_app {
    server host.docker.internal:3000;
}

upstream expertedu_studio_back {
    server host.docker.internal:8000;
}

server {
    listen 80;
    server_name expertedu-studio.fournext.website;

    return 301 https://expertedu-studio.fournext.website$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name expertedu-studio.fournext.website;

    ssl_certificate /etc/letsencrypt/live/expertedu-studio.fournext.website/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/expertedu-studio.fournext.website/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    absolute_redirect off;
    client_max_body_size 25M;

    location /api/ {
        proxy_pass http://expertedu_studio_back;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://expertedu_studio_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

